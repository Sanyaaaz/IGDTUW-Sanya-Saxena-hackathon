services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://finrisk:finrisk@db:5432/finrisk
      DEMO_MODE: "true"
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finrisk
      POSTGRES_USER: finrisk
      POSTGRES_PASSWORD: finrisk
    volumes: ["finrisk-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrisk -d finrisk"]
      interval: 5s
      timeout: 3s
      retries: 10
  dashboard:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  finrisk-db:
